s\">\n      </a>\n      <div class=\"method-steps\">\n        <article><h3>Condition</h3><p>Normal, instance, world-coordinate, and instance-level canonical-coordinate maps guide streaming RGB generation.</p></article>\n        <article><h3>Retrieve</h3><p>Instance identity and geometric correspondence select historical patch features before each chunk is generated.</p></article>\n        <article><h3>Update</h3><p>Completed chunks write clean key-value features into an instance-organized bank that consolidates repeated observations.</p></article>\n      </div>\n    </section>\n\n    <section id=\"benchmark\" class=\"benchmark section\" aria-labelledby=\"benchmark-title\">\n      <div class=\"wrap\">\n        <div class=\"section-head\"><h2 id=\"benchmark-title\">CodeMemBench</h2>\n          <p>27 static scenes and 16 dynamic sequences. Memory is evaluated by comparing geometrically aligned patches with each renderer’s own history.</p></div>\n        <div class=\"bench-showcase\">\n        <div class=\"bench-grid\" role=\"group\" aria-label=\"Featured CodeMemBench cases\"><article class=\"bench-card\">\n          <div class=\"bench-card-title\"><h3>Static appearance</h3><span>0031 · 1.6×</span></div>\n          <video controls muted playsinline preload=\"none\" poster=\"assets/benchmark/gt/0031-featured.webp\"\n            src=\"assets/benchmark/gt/0031-featured.mp4\" width=\"768\" height=\"432\" aria-label=\"Ground-truth Static appearance, Floating house\"></video>\n        </article><article class=\"bench-card\">\n          <div class=\"bench-card-title\"><h3>Moving-instance identity</h3><span>D08</span></div>\n          <video controls muted playsinline preload=\"none\" poster=\"assets/benchmark/gt/d08-featured.webp\"\n            src=\"assets/benchmark/gt/d08-featured.mp4\" width=\"768\" height=\"432\" aria-label=\"Ground-truth Moving-instance identity, Kart race\"></video>\n        </article><article class=\"bench-card\">\n          <div class=\"bench-card-titl
